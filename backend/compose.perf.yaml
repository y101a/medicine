name: medical-assistant-perf
services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-trixie
    pull_policy: never
    restart: "no"
    environment:
      POSTGRES_USER: perf
      POSTGRES_PASSWORD: perf-local-only
      POSTGRES_DB: medical_assistant_perf
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perf -d medical_assistant_perf"]
      interval: 3s
      timeout: 3s
      retries: 15
